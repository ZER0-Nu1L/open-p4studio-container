name: image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - sde-*-r*
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/zer0-nu1l/open-p4studio-container
  LOCAL_IMAGE: open-p4studio-container:selftest-${{ github.run_id }}

jobs:
  validate:
    name: validate
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    concurrency:
      group: open-p4studio-container-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out container repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Load pinned versions
        run: grep -Ev '^(#|$)' ci/image/versions.env >> "$GITHUB_ENV"

      - name: Prepare ephemeral runner
        run: ci/image/prepare-runner.sh

      - name: Initialize only open-p4studio
        run: git submodule update --init --recursive third_party/open-p4studio

      - name: Lint repository files
        run: ci/lint.sh

      - name: Verify pinned source and license material
        run: ci/image/verify-source.sh artifacts/source

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build local validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ci/image/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            UBUNTU_IMAGE=${{ env.UBUNTU_IMAGE }}
            SDE_VERSION=${{ env.SDE_VERSION }}
            OPEN_P4STUDIO_COMMIT=${{ env.OPEN_P4STUDIO_COMMIT }}
            P4C_COMMIT=${{ env.P4C_COMMIT }}
            IMAGE_PROFILE=${{ env.IMAGE_PROFILE }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Verify image contract
        run: ci/image/verify-image.sh "$LOCAL_IMAGE"

      - name: Run both model self-tests
        run: |
          mkdir -p artifacts/selftest
          docker run --rm --privileged \
            --volume "$PWD/artifacts/selftest:/artifacts" \
            "$LOCAL_IMAGE" \
            open-p4studio-selftest

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: publish
    if: ${{ startsWith(github.ref, 'refs/tags/sde-') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      release_tag: ${{ steps.release.outputs.tag }}
      container_commit: ${{ steps.release.outputs.container_commit }}
    steps:
      - name: Check out container repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Fetch current main ref
        run: >-
          git fetch --no-tags origin
          +refs/heads/main:refs/remotes/origin/main

      - name: Validate immutable release tag
        id: release
        shell: bash
        run: >-
          ci/release/validate_tag.sh
          "$GITHUB_REF_NAME"
          refs/remotes/origin/main
          >> "$GITHUB_OUTPUT"

      - name: Load pinned versions
        run: grep -Ev '^(#|$)' ci/image/versions.env >> "$GITHUB_ENV"

      - name: Prepare ephemeral runner
        run: ci/image/prepare-runner.sh

      - name: Initialize only open-p4studio
        run: git submodule update --init --recursive third_party/open-p4studio

      - name: Lint repository files
        run: ci/lint.sh

      - name: Verify pinned source and license material
        run: ci/image/verify-source.sh artifacts/source

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build local release candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ci/image/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            UBUNTU_IMAGE=${{ env.UBUNTU_IMAGE }}
            SDE_VERSION=${{ env.SDE_VERSION }}
            OPEN_P4STUDIO_COMMIT=${{ env.OPEN_P4STUDIO_COMMIT }}
            P4C_COMMIT=${{ env.P4C_COMMIT }}
            IMAGE_PROFILE=${{ env.IMAGE_PROFILE }}
            VCS_REF=${{ steps.release.outputs.container_commit }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Verify candidate image contract
        run: ci/image/verify-image.sh "$LOCAL_IMAGE"

      - name: Run candidate model self-tests
        run: |
          mkdir -p artifacts/release-selftest
          docker run --rm --privileged \
            --volume "$PWD/artifacts/release-selftest:/artifacts" \
            "$LOCAL_IMAGE" \
            open-p4studio-selftest

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          output-file: artifacts/open-p4studio-container.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable release image with attestations
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ci/image/Dockerfile
          platforms: linux/amd64
          load: false
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          build-args: |
            UBUNTU_IMAGE=${{ env.UBUNTU_IMAGE }}
            SDE_VERSION=${{ env.SDE_VERSION }}
            OPEN_P4STUDIO_COMMIT=${{ env.OPEN_P4STUDIO_COMMIT }}
            P4C_COMMIT=${{ env.P4C_COMMIT }}
            IMAGE_PROFILE=${{ env.IMAGE_PROFILE }}
            VCS_REF=${{ steps.release.outputs.container_commit }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Record pushed subject
        run: |
          printf '%s@%s\n' "$IMAGE_NAME" '${{ steps.push.outputs.digest }}' \
            | tee artifacts/image-reference.txt
          {
            echo '### Published candidate'
            echo
            echo '`'"$IMAGE_NAME@${{ steps.push.outputs.digest }}"'`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  verify-release:
    name: verify published digest
    needs: publish
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Load pinned versions
        run: grep -Ev '^(#|$)' ci/image/versions.env >> "$GITHUB_ENV"

      - name: Pull immutable digest anonymously
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '{"auths":{}}\n' > "$DOCKER_CONFIG/config.json"
          docker pull "$IMAGE_NAME@$DIGEST"

      - name: Verify pulled image contract
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: ci/image/verify-image.sh "$IMAGE_NAME@$DIGEST"

      - name: Re-run both self-tests from pulled digest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          mkdir -p artifacts/pullback-selftest
          docker run --rm --privileged \
            --volume "$PWD/artifacts/pullback-selftest:/artifacts" \
            "$IMAGE_NAME@$DIGEST" \
            open-p4studio-selftest

      - name: Upload pull-back evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-pullback-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: create release
    needs:
      - publish
      - verify-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Download release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-${{ github.run_id }}
          path: release-assets/evidence

      - name: Normalize release evidence names
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' artifact_dir; do
            artifact_name=$(basename "$artifact_dir")
            while IFS= read -r -d '' file; do
              relative=${file#"$artifact_dir"/}
              safe_relative=${relative//\//__}
              destination="release-assets/evidence/${artifact_name}__${safe_relative}"
              mv -- "$file" "$destination"
            done < <(find "$artifact_dir" -type f -print0)
            find "$artifact_dir" -depth -type d -empty -delete
          done < <(find release-assets/evidence -mindepth 1 -maxdepth 1 -type d -print0)

      - name: Render immutable image lock
        env:
          CONTAINER_COMMIT: ${{ needs.publish.outputs.container_commit }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
        run: |
          source ci/image/versions.env
          python3 ci/release/render_manifest.py \
            --image "$IMAGE_NAME" \
            --digest "$DIGEST" \
            --release "$RELEASE_TAG" \
            --source-repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --container-commit "$CONTAINER_COMMIT" \
            --versions ci/image/versions.env \
            --output release-assets/image-lock.json
          find release-assets -type f ! -name checksums.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum > release-assets/checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.publish.outputs.release_tag }}
          name: ${{ needs.publish.outputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Community-built Tofino 1 Open P4 Studio SDE model container.

            Immutable image:
            `${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.digest }}`

            This release passed the built-in minimal-forward and upstream
            tna_counter tests both before publication and after a fresh
            anonymous digest pull.

            The GHCR package is intentionally publicly pullable as an
            operational policy. Publication is not a legal determination
            about redistribution rights for Intel-licensed upstream binaries.
            This image contains no hardware BSP, private RDC material, or
            private hardware enablement and is not intended for physical
            Tofino hardware.
          files: |
            release-assets/image-lock.json
            release-assets/checksums.sha256
            release-assets/evidence/**/*
